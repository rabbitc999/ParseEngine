# transfer 外部机器配置示例
target=arm
word_bits=16

# 四元式翻译使用的工作寄存器
reg_a=r4
reg_b=r5
reg_c=r6
reg_hi=r12
reg_lo=r14

# 数据区和栈区
data_bin=example.data.bin
rodata.PI=314
rodata.VERSION=1
stack_words=2048

# 指令模板：花括号由生成器替换
memory_load=LDRSH {dst}, [{name}]
memory_store=STRH {src}, [{name}]
immediate_load=MOV {dst}, #{value}
cmd.add=ADD {dst}, {lhs}, {rhs}
cmd.sub=SUB {dst}, {lhs}, {rhs}
cmd.mul=MUL {dst}, {lhs}, {rhs}
cmd.div=SDIV {dst}, {lhs}, {rhs}
# 移位 / 按位指令同样可以替换；{lhs} 与 {rhs} 可重复出现。
cmd.shl=LSL {dst}, {lhs}, {rhs}
cmd.shr=ASR {dst}, {lhs}, {rhs}
cmd.and=AND {dst}, {lhs}, {rhs}
cmd.or=ORR {dst}, {lhs}, {rhs}
cmd.xor=EOR {dst}, {lhs}, {rhs}
cmd.not=MVN {dst}, {lhs}
