# 32 位 ARM 教学机：自定义寄存器、命名数据、只读区和原始 Bin 数据区。
target=arm
word_bits=32
reg_a=r4
reg_b=r5
reg_c=r6
reg_hi=r12
reg_lo=r14
stack_words=4096

# 原始字节按顺序放进 .data（byte_0、byte_1……）
data_bin=example/sample.data.bin

# 命名数据：类型由 .quad 里的 decl 决定
data.CONST_A=1000
data.CONST_B=13

# 只读变量：模拟器拒绝对它们执行写操作
rodata.PI=3.14159

# 指令模板可以整体替换成别的教学方言
memory_load=LDRSH {dst}, [{name}]
memory_store=STRH {src}, [{name}]
immediate_load=MOV {dst}, #{value}
cmd.add=ADD {dst}, {lhs}, {rhs}
cmd.sub=SUB {dst}, {lhs}, {rhs}
cmd.mul=MUL {dst}, {lhs}, {rhs}
cmd.div=SDIV {dst}, {lhs}, {rhs}
cmd.shl=LSL {dst}, {lhs}, {rhs}
cmd.shr=ASR {dst}, {lhs}, {rhs}
cmd.shru=LSR {dst}, {lhs}, {rhs}
cmd.and=AND {dst}, {lhs}, {rhs}
cmd.or=ORR {dst}, {lhs}, {rhs}
cmd.xor=EOR {dst}, {lhs}, {rhs}
cmd.not=MVN {dst}, {lhs}
